[project]
name = "invoice-agent"
version = "0.1.0"
description = "Builds the monthly invoice and merged timesheet PDF"
readme = "README.md"
authors = [
    { name = "Bianca Poling", email = "bnoeltorres@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "img2pdf>=0.6.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
invoice-agent = "invoice_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
]
